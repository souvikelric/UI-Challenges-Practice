<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary to Decimal</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <div class="controls">
        <div>
          <label for="topLeft">Top Left</label>
          <input id="topLeft" type="range" value="0" min="0" max="300" />
        </div>
        <div>
          <label for="topRight">Top Right</label>
          <input id="topRight" type="range" value="0" min="0" max="300" />
        </div>
        <div>
          <label for="bottomLeft">Bottom Left</label>
          <input id="bottomLeft" type="range" value="0" min="0" max="300" />
        </div>
        <div>
          <label for="bottomRight">Bottom Right</label>
          <input id="bottomRight" type="range" value="0" min="0" max="300" />
        </div>
      </div>
    </div>
  </body>
</html>
