<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary to Decimal</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <select id="dropdown">
        <option value="decimal">Binary to Decimal</option>
        <option value="binary">Decimal to Binary</option>
      </select>
      <div id="inputContainer">
        <input class="digit" type="text" maxlength="1" id="1" />
        <input class="digit" type="text" maxlength="1" id="2" />
        <input class="digit" type="text" maxlength="1" id="3" />
        <input class="digit" type="text" maxlength="1" id="4" />
        <input class="digit" type="text" maxlength="1" id="5" />
        <input class="digit" type="text" maxlength="1" id="6" />
        <input class="digit" type="text" maxlength="1" id="7" />
        <input class="digit" type="text" maxlength="1" id="8" />
      </div>
      <div class="error"></div>
      <button id="clickButton" type="button">Convert</button>
      <div class="answer">Please Input a Binary Number</div>
    </div>
  </body>
</html>
